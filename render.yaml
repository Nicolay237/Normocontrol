# Blueprint для Render: New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: normocontrol
    runtime: docker          # фронтенд и бэкенд собираются по Dockerfile
    plan: free               # free засыпает после 15 минут простоя; для кафедры лучше starter
    branch: master
    autoDeploy: true         # каждый push в master — новый деплой
    healthCheckPath: /health
    envVars:
      # ключ подписи сессий: Render сгенерирует сам; если поменять — все выйдут из аккаунтов
      - key: SECRET_KEY
        generateValue: true
      # первый администратор: создаётся при запуске, если его ещё нет в базе
      - key: ADMIN_LOGIN
        sync: false            # Render спросит значение при создании
      - key: ADMIN_PASSWORD
        sync: false
      # PostgreSQL для учётных записей (строка подключения postgresql://…).
      # Без неё учётки хранятся во временном файле и пропадают при каждом деплое.
      - key: DATABASE_URL
        sync: false
